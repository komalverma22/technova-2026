[build]
  command   = "npm run build"
  publish   = "dist"

# ── Edge Functions ────────────────────────────────────────────────────────────
# Injects dynamic OG meta tags for /events/:id so social crawlers
# (WhatsApp, Facebook, Twitter) see event-specific previews.
[[edge_functions]]
  function = "og-meta"
  path     = "/events/*"

# ── SPA Fallback ─────────────────────────────────────────────────────────────
# All routes not matched by a static file serve index.html so React Router
# can handle client-side navigation.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Response Headers ─────────────────────────────────────────────────────────
# Disable byte-range requests on HTML to prevent HTTP 206 responses
# that confuse WhatsApp / Facebook crawlers.
[[headers]]
  for = "/*.html"
  [headers.values]
    Accept-Ranges   = "none"
    Cache-Control   = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/index.html"
  [headers.values]
    Accept-Ranges = "none"
    Cache-Control = "public, max-age=0, must-revalidate"

# Static assets — long cache, immutable (Vite adds content hashes)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
