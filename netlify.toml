[build]
  command = "npm run build"
  publish = "dist"

# ── Edge Functions ─────────────────────────────────────────────────────────────
# og-meta intercepts GET requests for known social crawlers and injects
# dynamic Open Graph + Twitter Card meta tags so previews work on
# WhatsApp, Facebook, Twitter/X, LinkedIn, Discord, etc.
#
# Normal users are passed through untouched (no SSR, no hydration changes).

# Home page
[[edge_functions]]
  function = "og-meta"
  path     = "/"

# Every event detail / registration page
[[edge_functions]]
  function = "og-meta"
  path     = "/events/*"

# ── PDF pass-through ───────────────────────────────────────────────────────────
# Must come BEFORE the SPA catch-all so Netlify serves the real files.
[[redirects]]
  from   = "/*.pdf"
  to     = "/:splat.pdf"
  status = 200

# ── SPA Fallback ───────────────────────────────────────────────────────────────
# All routes not matched by a static file fall back to index.html so
# React Router can handle client-side navigation.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Response Headers ───────────────────────────────────────────────────────────
# Disable byte-range requests on HTML to prevent HTTP 206 responses
# that confuse WhatsApp / Facebook crawlers.
[[headers]]
  for = "/*.html"
  [headers.values]
    Accept-Ranges   = "none"
    Cache-Control   = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/index.html"
  [headers.values]
    Accept-Ranges = "none"
    Cache-Control = "public, max-age=0, must-revalidate"

# Static assets — long cache, immutable (Vite adds content hashes)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
