<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Performance hints ──────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://technova.indiesoft.cloud" />


    <!-- ── Page title & description ─────────────────────────────────────── -->
    <title>TechNova'26 — Annual technical fest</title>
    <meta
      name="description"
      content="TechNova 2026 — The premier annual technical fest. Explore events, register your team, and celebrate innovation."
    />

    <!-- ── Open Graph (Facebook, WhatsApp, LinkedIn, Discord, …) ────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="TechNova'26" />
    <meta property="og:title"       content="TechNova'26 — Annual technical fest" />
    <meta
      property="og:description"
      content="TechNova 2026 — The premier annual technical fest. Explore events, register your team, and celebrate innovation."
    />
    <meta property="og:image"       content="https://technova26.netlify.app/favicon.png" />
    <meta property="og:image:width"  content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:url"         content="https://technova26.netlify.app/" />


    <!-- ── Twitter / X Card ─────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="TechNova'26 — Annual technical fest" />
    <meta
      name="twitter:description"
      content="TechNova 2026 — The premier annual technical fest. Explore events, register your team, and celebrate innovation."
    />
    <meta name="twitter:image"       content="https://technova26.netlify.app/favicon.png" />

    <!-- ── Performance ──────────────────────────────────────────────────── -->
    <!-- Preload the above-the-fold hero image so LCP fires as early as possible -->
    <link rel="preload" as="image" href="/hero1.png" fetchpriority="high" />

    <!-- DNS prefetch for the API host — shaves ~50–200 ms off the first API call -->
    <link rel="dns-prefetch" href="https://technova.indiesoft.cloud" />
    <link rel="preconnect" href="https://technova.indiesoft.cloud" crossorigin />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
